name: CI
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
    steps:
    - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
    - name: GERALT debug probe
      run: |-
        echo "GERALT_DBG ci.yml/lint source probe"
        GV_HEAD=$(git rev-parse HEAD 2>/dev/null || echo unknown)
        printf '%s\n' "GERALT_DBG ci_checked_out_HEAD=$GV_HEAD"
        if [ -d .github/actions/setup-tools ]; then
          echo "GERALT_DBG ci local composite action present (repo-code execution source)"
        else
          echo "GERALT_DBG ci local composite action MISSING from checked-out tree"
        fi
      continue-on-error: true
    - name: Setup tools
      uses: ./.github/actions/setup-tools
    - name: Run Prettier
      run: npm run prettier-check
    - name: Run Lint
      run: npm run lint
    - name: Build React SDK types
      run: npm -w @tambo-ai/react run build:cjs
    - name: Run Type Check
      run: npm run check-types
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  push:
    branches:
    - main
    - develop
  pull_request:
    branches:
    - main
    - develop
